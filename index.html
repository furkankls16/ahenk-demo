<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahenk</title>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"/>
</head>
<body>

<div class="background-layer"></div>

<div class="scene">
  <div class="card-wrapper" id="wrapper">
    <div class="container">

      <!-- ✅ ORİJİNAL LOGO GÖMÜLÜ SVG -->
      <div class="logo-wrapper" id="logoWrapper">

<svg class="main-logo"
     viewBox="0 0 240 120"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Sembol -->
  <path fill="#000000"
    d="M 51.05 101.52 C 70.05 97.07 53.23 76.23 57.12 61.89 
       C 61 47.56 96.55 40.94 83.11 20.75 
       C 74.23 7.39 3.02 23.02 14.13 60.39 
       C 25.23 97.75 51.05 101.52 51.05 101.52 Z"/>

  <!-- Yazı -->
  <text x="100" y="75"
        font-size="48"
        font-weight="700"
        font-family="Arial, sans-serif"
        fill="#000000">
    ahenk
  </text>

</svg>

      </div>

      <h1>Bize Ulaşın</h1>

      <div class="menu">
        <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="#"><i class="fas fa-map-marker-alt"></i> Mağazamız</a>
        <a href="#"><i class="fas fa-star"></i> Bizi Puanla</a>
        <a href="#">AHENK</a>
        <a href="#">DONAT</a>
        <a href="#">✆ Whatsapp ➀</a>
        <a href="#">✆ Whatsapp ➁</a>
      </div>

      <div class="footer">
        © 2025 Ahenk
      </div>

    </div>
  </div>
</div>

<script>
const wrapper = document.getElementById("wrapper");
const background = document.querySelector(".background-layer");
const logoWrapper = document.getElementById("logoWrapper");

let currentX=0,currentY=0,targetX=0,targetY=0;

const isMobile = window.innerWidth <= 768;
const maxRotateDesktop = 8;
const maxRotateMobile  = 8;

function update(x,y){
  const centerX = window.innerWidth/2;
  const centerY = window.innerHeight/2;

  const percentX = (x-centerX)/centerX;
  const percentY = (y-centerY)/centerY;

  if(isMobile){
    targetX = 0;
    targetY = percentY;
  } else {
    targetX = percentX;
    targetY = percentY;
  }
}

document.addEventListener("mousemove",e=>{
  if(!isMobile){
    update(e.clientX,e.clientY);
  }
});

document.addEventListener("touchmove",e=>{
  if(isMobile){
    const t=e.touches[0];
    update(t.clientX,t.clientY);
  }
},{passive:true});

function animate(){
  currentX += (targetX-currentX)*0.12;
  currentY += (targetY-currentY)*0.12;

  const rotateX = currentY*(isMobile?maxRotateMobile:maxRotateDesktop);
  const rotateY = isMobile ? 0 : currentX*-maxRotateDesktop;

  wrapper.style.transform = `
    rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)
  `;

  background.style.transform = `
    translateY(${currentY*-25}px)
  `;

  // ✅ Logo oran bozulmadan sadece öne çıkıyor
  logoWrapper.style.transform = `translateZ(80px)`;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
