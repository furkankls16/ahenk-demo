<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahenk</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial, sans-serif;
  background:#c3ff6f;
  perspective:1500px;
  overflow:hidden;
}

/* Marka tonlu gradient */
.background-layer{
  position:fixed;
  inset:-5%;
  background:linear-gradient(135deg,#d8ff9a,#c3ff6f,#aeea55);
  z-index:-1;
  transition:transform 0.1s ease-out;
}

.scene{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-wrapper{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
  transition:transform 0.12s ease-out;
}

.container{
  width:92%;
  max-width:850px;
  padding:35px 25px;
  border-radius:24px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(6px);
  text-align:center;
  box-shadow:
    0 35px 70px rgba(0,0,0,0.25),
    0 20px 40px rgba(0,0,0,0.15);
}

.logo{
  width:130px;
  margin-bottom:20px;
}

h1{
  margin-bottom:25px;
}

.menu{
  display:grid;
  gap:14px;
}

.menu a{
  padding:14px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  color:#111;
  background:rgba(255,255,255,0.6);
  transition:all 0.2s ease;
  box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.menu a:hover{
  transform:translateY(-2px);
}

.footer{
  margin-top:20px;
  font-size:14px;
}

/* Mobil hafif küçültme */
@media (max-width:768px){
  .container{
    transform:scale(0.95);
  }
  .logo{
    width:110px;
  }
}
</style>
</head>
<body>

<div class="background-layer"></div>

<div class="scene">
  <div class="card-wrapper" id="wrapper">
    <div class="container">
      <img src="https://i.hizliresim.com/ar1wgl8.png" class="logo"/>
      <h1>Bize Ulaşın</h1>

      <div class="menu">
        <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="#"><i class="fas fa-map-marker-alt"></i> Mağazamız</a>
        <a href="#"><i class="fas fa-star"></i> Bizi Puanla</a>
        <a href="#">AHENK</a>
        <a href="#">DONAT</a>
        <a href="#">✆ Whatsapp ➀</a>
        <a href="#">✆ Whatsapp ➁</a>
      </div>

      <div class="footer">
        © 2025 Ahenk
      </div>
    </div>
  </div>
</div>

<script>
const wrapper = document.getElementById("wrapper");
const background = document.querySelector(".background-layer");

let currentX=0,currentY=0,targetX=0,targetY=0;

const isMobile = window.innerWidth <= 768;
const maxRotate = 4; // ✅ Eski güçlü his geri geldi

function update(x,y){
  const centerX = window.innerWidth/2;
  const centerY = window.innerHeight/2;

  let percentX = (x-centerX)/centerX;
  let percentY = (y-centerY)/centerY;

  if(isMobile){
    targetX = 0;               // ✅ Mobilde sağ-sol kapalı
    targetY = percentY;
  } else {
    targetX = percentX;
    targetY = percentY;
  }
}

document.addEventListener("mousemove",e=>{
  if(!isMobile){
    update(e.clientX,e.clientY);
  }
});

document.addEventListener("touchmove",e=>{
  if(isMobile){
    const t=e.touches[0];
    update(t.clientX,t.clientY);
  }
},{passive:true});

function animate(){
  currentX += (targetX-currentX)*0.08;
  currentY += (targetY-currentY)*0.08;

  const rotateX = currentY*maxRotate;
  const rotateY = currentX*-maxRotate;

  wrapper.style.transform = `
    rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)
  `;

  background.style.transform = `
    translateY(${currentY*-12}px)
  `;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
