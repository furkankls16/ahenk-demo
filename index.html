<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahenk</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial, sans-serif;
  perspective:1200px;
  overflow-x:hidden;
}

/* ✅ Marka rengine sadık gradient */
.background-layer{
  position:fixed;
  inset:-10%;
  background:linear-gradient(
    135deg,
    #d8ff9a,
    #c3ff6f,
    #aeea55
  );
  background-size:140% 140%;
  z-index:-1;
  transition:transform 0.15s ease-out;
}

/* 3D sahne */
.scene{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
  transition:transform 0.15s ease-out;
}

/* ✅ Responsive container */
.container{
  width:92%;
  max-width:900px;
  padding:40px 30px;
  border-radius:24px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(8px);
  text-align:center;
  transform:translateZ(40px);
  box-shadow:
    0 30px 60px rgba(0,0,0,0.25),
    0 15px 30px rgba(0,0,0,0.15);
}

.logo{
  width:140px;
  margin-bottom:20px;
  transform:translateZ(60px);
}

h1{
  margin-bottom:30px;
  transform:translateZ(50px);
}

.menu{
  display:grid;
  gap:15px;
}

.menu a{
  display:block;
  padding:14px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  color:#111;
  background:rgba(255,255,255,0.5);
  transform:translateZ(45px);
  transition:all 0.2s ease;
  box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.menu a:hover{
  transform:translateZ(55px);
  box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

.footer{
  margin-top:25px;
  font-size:14px;
  transform:translateZ(30px);
}
</style>
</head>
<body>

<div class="background-layer"></div>

<div class="scene" id="scene">
  <div class="container">
    <img src="https://i.hizliresim.com/ar1wgl8.png" class="logo" />
    <h1>Bize Ulaşın</h1>

    <div class="menu">
      <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="#"><i class="fas fa-map-marker-alt"></i> Mağazamız</a>
      <a href="#"><i class="fas fa-star"></i> Bizi Puanla</a>
      <a href="#">AHENK</a>
      <a href="#">DONAT</a>
      <a href="#">✆ Whatsapp ➀</a>
      <a href="#">✆ Whatsapp ➁</a>
    </div>

    <div class="footer">
      © 2025 Ahenk
    </div>
  </div>
</div>

<script>
const scene = document.getElementById("scene");
const background = document.querySelector(".background-layer");

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

function updatePosition(x,y){
  const centerX = window.innerWidth/2;
  const centerY = window.innerHeight/2;

  targetX = (x-centerX)/centerX;
  targetY = (y-centerY)/centerY;
}

document.addEventListener("mousemove",e=>{
  updatePosition(e.clientX,e.clientY);
});

document.addEventListener("touchmove",e=>{
  const t = e.touches[0];
  updatePosition(t.clientX,t.clientY);
},{passive:true});

function animate(){
  currentX += (targetX-currentX)*0.07;
  currentY += (targetY-currentY)*0.07;

  const rotateX = currentY*3; 
  const rotateY = currentX*-3;

  scene.style.transform = `
    rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)
  `;

  background.style.transform = `
    translateX(${currentX*-20}px)
    translateY(${currentY*-20}px)
  `;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
