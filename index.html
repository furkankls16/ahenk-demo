<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahenk 3D</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial, sans-serif;
  overflow:hidden;
  perspective:1200px;
  background:#111;
  transition:background-position 0.2s ease-out;
}

/* Gradient arka plan */
.background-layer{
  position:fixed;
  width:120%;
  height:120%;
  top:-10%;
  left:-10%;
  background:linear-gradient(135deg,#1a1a1a,#2c3e50,#4b0082);
  background-size:200% 200%;
  z-index:-1;
  transition:transform 0.2s ease-out;
}

/* 3D sahne */
.scene{
  transform-style:preserve-3d;
  transition:transform 0.2s ease-out;
}

/* Ana panel */
.container{
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  text-align:center;
  transform:translateZ(40px);
  box-shadow:
    0 25px 50px rgba(0,0,0,0.4),
    0 10px 20px rgba(0,0,0,0.3);
}

.logo{
  width:120px;
  margin-bottom:20px;
  transform:translateZ(60px);
}

h1{
  color:#fff;
  margin-bottom:25px;
  transform:translateZ(50px);
}

.menu a{
  display:block;
  margin:12px 0;
  padding:12px;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  font-weight:bold;
  background:rgba(255,255,255,0.08);
  transform:translateZ(45px);
  transition:all 0.2s ease;
  box-shadow:0 8px 15px rgba(0,0,0,0.3);
}

.menu a:hover{
  transform:translateZ(55px);
  box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

.footer{
  margin-top:20px;
  font-size:13px;
  color:#ccc;
  transform:translateZ(30px);
}
</style>
</head>
<body>

<div class="background-layer"></div>

<div class="scene" id="scene">
  <div class="container">
    <img src="https://i.hizliresim.com/ar1wgl8.png" class="logo" />
    <h1>Bize Ulaşın</h1>

    <div class="menu">
      <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="#"><i class="fas fa-map-marker-alt"></i> Mağazamız</a>
      <a href="#"><i class="fas fa-star"></i> Bizi Puanla</a>
      <a href="#">AHENK</a>
      <a href="#">DONAT</a>
      <a href="#">✆ Whatsapp ➀</a>
      <a href="#">✆ Whatsapp ➁</a>
    </div>

    <div class="footer">
      © 2025 Ahenk
    </div>
  </div>
</div>

<script>
const scene = document.getElementById("scene");
const background = document.querySelector(".background-layer");

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

/* Hareket algılama */
function handleMove(x,y){
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  targetX = (x - centerX) / centerX;
  targetY = (y - centerY) / centerY;
}

/* Mouse */
document.addEventListener("mousemove", e=>{
  handleMove(e.clientX,e.clientY);
});

/* Touch */
document.addEventListener("touchmove", e=>{
  const touch = e.touches[0];
  handleMove(touch.clientX,touch.clientY);
});

/* Yumuşak animasyon */
function animate(){
  currentX += (targetX - currentX) * 0.08;
  currentY += (targetY - currentY) * 0.08;

  const rotateX = currentY * 4;   // max 4 derece
  const rotateY = currentX * -4;

  scene.style.transform = `
    rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)
  `;

  background.style.transform = `
    translateX(${currentX * -30}px)
    translateY(${currentY * -30}px)
  `;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
