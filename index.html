<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ahenk</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"/>
</head>
<body>

<div class="background-layer"></div>

<div class="scene">
  <div class="card-wrapper" id="wrapper">
    <div class="container">

      <!-- ✅ ORİJİNAL SVG AYNEN -->
      <div class="logo-wrapper" id="logoWrapper">
        <!-- Senin SVG'in hiçbir değişiklik yapılmadan -->
        <!-- Buraya Canva'dan indirdiğin orijinal SVG kodunu aynen yapıştır -->
        
        <!-- Örnek placeholder -->
        <img src="logo.svg" alt="Ahenk Logo" class="main-logo">

      </div>

      <h1>Bize Ulaşın</h1>

      <div class="menu">
        <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="#"><i class="fas fa-map-marker-alt"></i> Mağazamız</a>
        <a href="#"><i class="fas fa-star"></i> Bizi Puanla</a>
        <a href="#">AHENK</a>
        <a href="#">DONAT</a>
        <a href="#">✆ Whatsapp ➀</a>
        <a href="#">✆ Whatsapp ➁</a>
      </div>

      <div class="footer">
        © 2025 Ahenk
      </div>

    </div>
  </div>
</div>

<script>
const wrapper = document.getElementById("wrapper");
const background = document.querySelector(".background-layer");
const logoWrapper = document.getElementById("logoWrapper");

let currentX=0,currentY=0,targetX=0,targetY=0;

const isMobile = window.innerWidth <= 768;
const maxRotateDesktop = 8;
const maxRotateMobile  = 8;

function update(x,y){
  const centerX = window.innerWidth/2;
  const centerY = window.innerHeight/2;

  const percentX = (x-centerX)/centerX;
  const percentY = (y-centerY)/centerY;

  if(isMobile){
    targetX = 0;
    targetY = percentY;
  } else {
    targetX = percentX;
    targetY = percentY;
  }
}

document.addEventListener("mousemove",e=>{
  if(!isMobile){
    update(e.clientX,e.clientY);
  }
});

document.addEventListener("touchmove",e=>{
  if(isMobile){
    const t=e.touches[0];
    update(t.clientX,t.clientY);
  }
},{passive:true});

function animate(){
  currentX += (targetX-currentX)*0.12;
  currentY += (targetY-currentY)*0.12;

  const rotateX = currentY*(isMobile?maxRotateMobile:maxRotateDesktop);
  const rotateY = isMobile ? 0 : currentX*-maxRotateDesktop;

  wrapper.style.transform = `
    rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)
  `;

  background.style.transform = `
    translateY(${currentY*-25}px)
  `;

  // ✅ Logo sadece hafif daha önde
  logoWrapper.style.transform = `
    translateZ(80px)
  `;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
